# tools/test/org.toml
name = "Testorg"
endpoint = "example.com"
timezone = "Europe/Stockholm"
locale = "en_US.UTF-8"
namespaces = [
  "local",
]
build-hosts = [
  "testhost",
]
root-identities = [
  "root-1",
  "root-2",
]

[ops.rebuild]
"*" = [
  "rebuild:age-key",
]

[ops.check]
"host:luks+server" = [
  "check:luks-key",
]
"host:server" = [
  "check:age-key",
  "check:ssh-key",
]
"host-lorem" = [
  "check:age-key",
  "check:ssh-key",
]

[ops.verify]
"*" = [
  "verify:age-key",
]
"user-*" = [
  "verify:ssh-key",
  "verify:passwd",
  "verify:mail",
]
"host-*" = [
  "verify:wg-key",
]
"service-*" = [
  "verify:ssh-key",
  "verify:tls-cert",
  "verify:passwd",
  "verify:mail",
]

[user.testuser]
grants = [
  "host-testhost",
]

[user.testadmin]
grants = [
  "host-*",
]

[service.testservice]
grants = [
  "host-*",
]

[service.sysctl-user-portal]
grants = [
  "host-*",
]

[service.locksmith]
grants = [
  "host-*",
]

[service.domain-local]
grants = [
  "host-*",
]

[root.1]

[role.testrole]

[role.lorem]

[app]

[store]

[host.testhost]
id = 1
roles = ["testrole"]
endpoint = "stationary.kompismoln.se"
users = []
vpns = []
system = "x86_64-linux"

[host.lorem]
id = 2
roles = [
  "testrole",
  "lorem",
]
users = []
vpns = []
system = "x86_64-linux"
stateVersion = "20.03"
