name = "Test AB"
endpoint = "example.com"
prefix = "fd12:3456:7890"
prefix4 = "10.0"
timezone = "Europe/Stockholm"
locale = "en_US.UTF-8"
root-identities = ["root-1"]
postgres = "17"

[vpn.wg0]
id = 0
trusted = true
gateway = "mx"
namespace = "mail"

[mailserver]
dkimSelector = "s1"

[domain."example.com"]
mailbox = true

# Fact: the blog's and the calendar's own domains, which they send as but receive at none of.
[domain."example.org"]
mailbox = false

[domain."example.net"]
mailbox = false

[root.1]

[host.mx]
id = 1
endpoint = "mx.example.com"
roles = ["mailserver"]
vpns = ["wg0"]
system = "x86_64-linux"
stateVersion = "26.05"

[host.web]
id = 2
users = ["alice"]
roles = ["app-scheduler"]
vpns = ["wg0"]
system = "x86_64-linux"
stateVersion = "26.05"

[user.alice]
id = 0
principal.mail = { inbox = true, send = true }
grants = ["host-*"]

# Fact: the mail server's admin, whose mailboxes alice reads as her own login's Shared.admin.
[user.admin]
id = 1
principal.mail = { inbox = true, readers = ["user-alice"] }
grants = ["host:mailserver"]

[app.blog]
id = 0
endpoint = "www.example.org"
altpoints = ["example.org"]
ssl = false
run-on-hosts = ["web"]
grants = ["host:app-scheduler", "host:mailserver"]
principal.members = ["nginx"]
principal.mail = { send = true, sendAs = ["@example.org"] }
kind = "wordpress"

[app.calendar]
id = 1
endpoint = "example.net"
ssl = false
run-on-hosts = ["web"]
grants = ["host:app-scheduler", "host:mailserver"]
principal.mail = { send = true, sendAs = ["@example.net"] }
kind = "mobilizon"
from = "noreply@example.net"

[app.auth]
id = 2
endpoint = "auth.example.com"
ssl = false
run-on-hosts = ["web"]
grants = ["host:app-scheduler", "host:mailserver"]
principal.mail = { inbox = true, send = true }
kind = "keycloak"
realms.example = { displayName = "Example" }

# Fact: a jitsi on no host, whose client auth keeps.
[app.meet]
id = 3
endpoint = "meet.example.com"
run-on-hosts = []
principal.hasPublicKey = false
kind = "jitsi"
keycloak = "auth"
realm = "example"

# Fact: a drive whose confidential client auth keeps, with the secret web decrypts as the app-scheduler, and
# whose user alice has a bind of a directory in its home; only
# vmTests.keycloak runs it, on web.
[app.cloud]
id = 4
endpoint = "cloud.example.com"
run-on-hosts = []
grants = ["host:app-scheduler"]
kind = "drive"
keycloak = "auth"
realm = "example"
storages.alice.files = { bind = "/var/lib/cloud/alice" }

# Fact: a photos app whose confidential client auth keeps, with the secret web decrypts as the app-scheduler, and
# whose user alice's root is in box's share on mx; only vmTests.photos runs it, on web.
[app.photos]
id = 5
endpoint = "photos.example.com"
run-on-hosts = []
grants = ["host:app-scheduler", "host:mailserver"]
principal.mail.send = true
kind = "photos"
keycloak = "auth"
realm = "example"
roots.alice = "store-box"

# Fact: a portal whose public client auth keeps, which lists the apps with an endpoint, and mails requests for an
# invite to elsewhere's carol, whose mail the mail test reads.
[app.www]
id = 6
endpoint = "www.example.com"
ssl = false
run-on-hosts = ["web"]
grants = ["host:app-scheduler", "host:mailserver"]
principal.hasPublicKey = false
principal.mail.send = true
kind = "portal"
invites = "carol@elsewhere.test"
logo = "site-logo.svg"
keycloak = "auth"
realm = "example"
services = ["cloud", "meet", "auth"]

# Fact: a status page, which watches the portal and the apps it lists, and the mail server.
[app.status]
id = 7
endpoint = "status.example.com"
ssl = false
run-on-hosts = ["web"]
principal.hasPublicKey = false
kind = "status"
portal = "www"
mail = "Mail"
groups.Services = ["www", "auth", "cloud"]
announcements = [
  { timestamp = "2026-11-18T09:00:00+01:00", type = "information", message = "The status page is up." },
]

[store.box]
id = 0
smb = { host = "mx.example.com", share = "alice", login = "alice" }
principal.hasPublicKey = false
grants = ["host:app-scheduler"]

[role.mailserver]
services = ["mailserver", "webmail", "dmarc-reports"]

[role.app-scheduler]

[service.mailserver]

[service.webmail]

[service.dmarc-reports]
id = 0
principal.hasPublicKey = false
principal.mail = { inbox = true, send = true }
grants = ["host:mailserver"]
