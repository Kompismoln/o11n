name = "Test AB"
endpoint = "example.com"
prefix = "fd12:3456:7890"
prefix4 = "10.0"
timezone = "Europe/Stockholm"
locale = "en_US"
root-identities = ["root-1"]

[vpn.wg0]
id = 0
trusted = true
gateway = "zhost"
namespace = "allotments"

[user.alice]
id = 0
principal.hasPasswd = false
principal.hasPublicKey = false

[store.files]
id = 0
principal.hasPublicKey = false
grants = ["host-laptop"]

[host.zhost]
id = 1
endpoint = "zhost.example.com"
roles = ["torrent-server", "media-server"]
vpns = ["wg0"]
system = "x86_64-linux"
stateVersion = "26.05"

[host.zhost.disk-layouts.main]
layout = "main-server-ai"
devices = "/dev/sda"

[host.laptop]
id = 2
users = ["alice"]
roles = []
vpns = ["wg0"]
system = "x86_64-linux"
stateVersion = "26.05"

[allotment."user-alice@zhost"]
size = "40G"
replicas = ["laptop"]
sftp = ["app-cloud"]

[allotment."store-files@zhost"]
size = "1T"

[allotment."service-media-server@zhost"]
size = "500G"
torrent = true

# Fact: a nextcloud that mounts alice's allotment, which laptop would run as an app-scheduler, and doesn't.
[app.cloud]
id = 0
endpoint = "cloud.example.com"
run-on-hosts = ["laptop"]
nextcloud.external.alice.zhost = { allotment = "user-alice@zhost", sharing = true }
# Fact: lisa is a Nextcloud user alone, whose mount logs in with store-files' sftp-key.
nextcloud.external.lisa.files = { sftp = { host = "files.example.com", login = "lisa", key = "store-files" } }

[root.1]

[service.torrent-server]
id = 0

[service.torrent-server.hosts.zhost]
upload = 200
ratio = 2

[role.torrent-server]
services = ["torrent-server"]

[service.media-server]
id = 1
vpn = "wg0"
principal.hasPublicKey = false

[role.media-server]
services = ["media-server"]
