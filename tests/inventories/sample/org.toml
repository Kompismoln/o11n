name = "Test AB"
endpoint = "example.com"
prefix = "fd12:3456:7890"
prefix4 = "10.0"
timezone = "Europe/Stockholm"
locale = "en_US.UTF-8"
root-identities = ["root-1"]
build-hosts = ["gw"]

[flake]
type = "github"
owner = "example"
repo = "sample"

[repository]
type = "github"
owner = "example"
repo = "sample"

[vpn.wg0]
id = 0
trusted = true
gateway = "gw"
namespace = "sample"
dns = ["gw"]

[mailserver]
dkimSelector = "s1"

[domain."example.com"]
mailbox = true

[root.1]

[host.gw]
id = 1
rescueMode = true
boot = "grub"
endpoint = "gw.example.com"
users = ["admin"]
roles = ["peer", "server", "remote-builder", "substituter", "mailserver"]
vpns = ["wg0"]
system = "x86_64-linux"
stateVersion = "26.05"

[host.web]
id = 2
endpoint = "web.example.com"
users = ["admin"]
roles = ["peer", "server", "remote-builder-relay", "archive"]
vpns = ["wg0"]
system = "x86_64-linux"
stateVersion = "26.05"
home.admin.roles = ["cinnamon-office"]

[host.web.disk-layouts.main]
layout = "main-server-btrfs"
devices = "/dev/sda"

[user.admin]
id = 0
description = "Administrator"
principal.mail = { inbox = true, send = true }
principal.groups = ["wheel"]
principal.state.archives.web.schedule = "daily"
principal.state.archives.web.prune.keep-last = 2
email = "admin@example.com"
grants = ["host-*"]

[role.peer]
services = [
  "rescue",
  "locksmith",
  "nix-build",
  "nix-push",
  "nix-switch",
]

[role.server]
services = [
  "egress-proxy",
  "reverse-tunnel",
]

[role.substituter]
services = ["nix-serve"]

[role.remote-builder]
services = ["nix-remote"]

[role.remote-builder-relay]
services = ["remote-builder-relay"]

[role.archive]
services = ["archive"]
stores = ["archives"]

[role.mailserver]
services = ["mailserver", "dmarc-reports"]

[service.rescue]
grants = ["host-*"]

[service.locksmith]
id = 0
principal.hasBash = true
grants = ["host-*"]

[service.reverse-tunnel]
id = 1
grants = ["host:server"]

[service.nix-build]
id = 2
principal.hasBash = true
grants = ["host-*"]

[service.nix-switch]
id = 3
principal.hasBash = true
grants = ["host-*"]

[service.nix-push]
id = 4
principal.hasBash = true
grants = ["host-*"]

[service.egress-proxy]
id = 7
grants = ["host:server"]

[service.nix-serve]
grants = ["host-*"]

[service.nix-remote]
id = 10
principal.hasPublicKey = false
grants = ["host:remote-builder"]

[service.remote-builder-relay]

[service.archive]
id = 11
vpn = "wg0"
principal.hasPublicKey = false
principal.mail.send = true
grants = ["host:archive", "host:mailserver"]

[service.mailserver]

[service.dmarc-reports]
id = 12
principal.hasPublicKey = false
principal.mail.inbox = true
grants = ["host:mailserver"]

[service.domain-sample]
grants = ["host:archive"]

[ops.check]
"host:server+substituter" = ["check:age-key"]
"service-rescue" = ["verify:ssh-key", "verify:passwd"]

[store.archives]
id = 0
principal.hasPublicKey = false
principal.hasSFTP = false

# Every class needs a table, even when empty.
[app]
