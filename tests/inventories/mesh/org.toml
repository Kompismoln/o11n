name = "Test AB"
endpoint = "example.com"
prefix = "fd12:3456:7890"
prefix4 = "10.0"
timezone = "Europe/Stockholm"
locale = "en_US"
root-identities = ["root-1"]

[vpn.wg0]
id = 0
trusted = true
gateway = "alpha"
namespace = "access"
dns = ["alpha"]

[vpn.wg1]
id = 1
trusted = false
topology = "mesh"
namespace = "data"
dns = []

[host.alpha]
id = 1
endpoint = "alpha.example.com"
roles = []
vpns = ["wg0", "wg1"]
system = "x86_64-linux"
stateVersion = "26.05"
behind = "windsor"
network.eth = { interface = "eth0", mode = "dhcp", suffix = "::a", mac = "02:00:00:00:00:01", address4 = "192.168.1.11" }

[host.beta]
id = 2
endpoint = "beta.example.com"
roles = []
vpns = ["wg0", "wg1"]
system = "x86_64-linux"
stateVersion = "26.05"
behind = "windsor"
network.eth = { interface = "eth0", mode = "dhcp", suffix = "::b", address4 = "192.168.1.12" }

[host.gamma]
id = 3
roles = []
vpns = ["wg0", "wg1"]
system = "x86_64-linux"
stateVersion = "26.05"
network.eth = { interface = "eth0", mode = "dhcp", suffix = "::fba" }
network.wifi = { interface = "wlan0", mode = "dhcp" }

[host.delta]
id = 4
roles = []
vpns = ["wg1"]
system = "x86_64-linux"
stateVersion = "26.05"

[host.windsor]
id = 5
roles = []
vpns = []
system = "mips-linux"
keys.wifi-key = "passphrase"
keys.glesys-key = "passphrase"

[host.windsor.router]
dmz = "beta"
glesys = { account = "CL12345" }

[host.windsor.openwrt]
release = "25.12.6"
target = "ath79/generic"
profile = "netgear_wndr3700"
packages = ["-ppp", "-ppp-mod-pppoe"]

[host.windsor.openwrt.uci.system."@system[0]"]
zonename = "UTC"

[host.windsor.openwrt.uci.wireless.radio0]
_type = "wifi-device"
disabled = 0

[host.windsor.openwrt.uci.wireless.default_radio0]
_type = "wifi-iface"
ssid = "windsor"
encryption = "psk2"
key = { secret = "wifi-key" }

[root.1]

# Fact: every class needs a table, even when empty.
[user]
[service]
[app]
