[parts.mail]
stage = "drafted"
layer = "domain"
doc = "docs/parts/mail.md"
code = [
  "nixos/org/mail.nix",
  "nixos/services/mailserver.nix",
  "org/mail.nix",
  "org/mailserver.nix",
]

[parts.o11n]
stage = "drafted"
layer = "ux"
doc = "docs/parts/o11n.md"
