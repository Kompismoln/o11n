{% extends "base.html" %}
{% block content %}
<article class="wrap">
  <h1>{{ page.title }}</h1>
  {%- if page.date %}
  <p class="muted"><time datetime="{{ page.date }}">{{ page.date | date(format="%Y-%m-%d") }}</time></p>
  {%- endif %}
  <div class="prose">{{ page.content | safe }}</div>
</article>
{% endblock content %}
