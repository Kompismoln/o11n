[package]
name = "gate"
version = "0.1.0"
description = "Keycloak login in front of an app, for nginx's auth_request, with passwords for the devices of its users"
edition = "2024"
license = "MIT"

[dependencies]
base64 = "0.23"
form_urlencoded = "1"
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
ureq = { version = "3", default-features = false, features = ["json", "rustls"] }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }

[workspace]
