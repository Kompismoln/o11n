name = "Testorg"
endpoint = "example.com"
prefix = "fd12:3456:7890"
prefix4 = "10.0"
timezone = "Europe/Stockholm"
locale = "en_US.UTF-8"
namespaces = [
  "local",
]
build-hosts = [
  "testhost",
]
root-identities = [
  "root-1",
  "root-2",
]

[user.testuser]
id = 1
principal.mail = { inbox = true, send = true, sendAs = ["@example.org"] }
grants = [
  "host-testhost",
]
principal.state.archives.lorem.prune.keep-last = 2
principal.state.archives.testhost.schedule = "daily"

[user.admin]

[user.testadmin]
grants = [
  "host-*",
]

[service.testservice]
grants = [
  "host-*",
]
actors = ["user-testadmin"]

[service.sysctl-user-portal]
grants = [
  "host-*",
]
keys.secret-key = "passphrase"

[service.nix-serve]
grants = [
  "host-*",
]

[service.rescue]
grants = [
  "host-*",
]

[service.locksmith]
grants = [
  "host-*",
]

[service.nix-switch]
grants = [
  "host-*",
]

[service.domain-local]
grants = [
  "host-*",
]

[service.mailserver]

[service.nix-remote]

[mailserver]
dkimSelector = "mail"

[domain."example.com"]
mailbox = true

[domain."example.org"]
mailbox = false

[root.1]

[role.testrole]

[role.serving]
services = ["locksmith", "mailserver", "nix-remote", "nix-switch"]

[role.lorem]

[app.auth]
id = 0
endpoint = "auth.example.com"
run-on-hosts = []
principal.mail = { inbox = true, send = true }
keycloak.realms.example = {}

[store]

[vpn.wg0]
id = 0
trusted = true
gateway = "testhost"
namespace = "local"
dns = ["testhost"]

[vpn.wg1]
id = 1
trusted = true
gateway = "testhost"
namespace = "local"
dns = ["testhost"]

[vpn.wg2]
id = 2
trusted = true
gateway = "testhost"
namespace = "local"
dns = ["testhost"]

[host.testhost]
id = 1
roles = ["testrole", "serving"]
endpoint = "stationary.kompismoln.se"
users = ["testuser"]
vpns = ["wg0", "wg1", "wg2"]
system = "x86_64-linux"

[host.testhost.disk-layouts.main]
layout = "main-server-btrfs"
devices = "/dev/sda"

[host.lorem]
id = 2
roles = [
  "testrole",
  "lorem",
]
users = ["testuser"]
vpns = ["wg0"]
system = "x86_64-linux"
stateVersion = "20.03"

[allotment."user-testuser@testhost"]
size = "1G"
replicas = ["lorem"]

[host.ipsum]
id = 3
nixos = false
roles = ["testrole"]
users = []
vpns = ["wg0"]
system = "aarch64-linux"
