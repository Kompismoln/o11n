name = "Testorg"
endpoint = "example.com"
prefix = "fd12:3456:7890"
prefix4 = "10.0"
timezone = "Europe/Stockholm"
locale = "en_US.UTF-8"
namespaces = [
  "local",
]
build-hosts = [
  "testhost",
]
root-identities = [
  "root-1",
  "root-2",
]

[ops.rebuild]
"*" = [
  "rebuild:age-key",
]

[ops.check]
"host:luks+server" = [
  "check:luks-key",
]
"host:server" = [
  "check:age-key",
  "check:ssh-key",
]
"host-lorem" = [
  "check:age-key",
  "check:ssh-key",
]

[ops.verify]
"*" = [
  "verify:age-key",
]
"user-*" = [
  "verify:ssh-key",
  "verify:passwd",
  "verify:mail",
]
"host-*" = [
  "verify:wg0-key",
]
"service-*" = [
  "verify:ssh-key",
  "verify:tls-cert",
  "verify:passwd",
]

[ops.amiss]
"host-*" = [
  "verify:mail",
]

[user.testuser]
id = 1
principal.mail = { inbox = true, send = true }
grants = [
  "host-testhost",
]
principal.state.archives.lorem.prune.keep-last = 2
principal.state.archives.testhost = {}

[user.admin]

[user.testadmin]
grants = [
  "host-*",
]

[service.testservice]
grants = [
  "host-*",
]
actors = ["user-testadmin"]

[service.sysctl-user-portal]
grants = [
  "host-*",
]
keys.secret-key = "passphrase"

[service.nix-serve]
grants = [
  "host-*",
]

[service.rescue]
grants = [
  "host-*",
]

[service.locksmith]
grants = [
  "host-*",
]

[service.domain-local]
grants = [
  "host-*",
]

[root.1]

[role.testrole]

[role.lorem]

[app]

[store]

[vpn.wg0]
id = 0
trusted = true
gateway = "testhost"
namespace = "local"
dns = ["testhost"]

[vpn.wg1]
id = 1
trusted = true
gateway = "testhost"
namespace = "local"
dns = ["testhost"]

[vpn.wg2]
id = 2
trusted = true
gateway = "testhost"
namespace = "local"
dns = ["testhost"]

[host.testhost]
id = 1
roles = ["testrole"]
endpoint = "stationary.kompismoln.se"
users = ["testuser"]
vpns = ["wg0", "wg1", "wg2"]
system = "x86_64-linux"

[host.testhost.disk-layouts.main]
layout = "main-server-btrfs"
devices = "/dev/sda"

[host.lorem]
id = 2
roles = [
  "testrole",
  "lorem",
]
users = ["testuser"]
vpns = ["wg0"]
system = "x86_64-linux"
stateVersion = "20.03"
