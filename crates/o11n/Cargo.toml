[package]
name = "o11n"
version = "0.1.0"
description = "Reads an evaluated org and acts on it"
edition.workspace = true
license.workspace = true

[dependencies]
age = { version = "0.11", features = ["armor"] }
base64 = "0.23.1"
clap = { version = "4", features = ["derive", "env"] }
ed25519-dalek = { version = "3.0.0", features = ["rand_core"] }
libc = "0.2"
rand = "0.8"
rcgen = "0.14.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha-crypt = "0.6.0"
ssh-key = { version = "0.6.7", features = ["ed25519", "rand_core", "std"] }
time = "0.3.55"
x25519-dalek = { version = "3.0.0", features = ["static_secrets"] }
x509-parser = "0.18.1"

[lints]
workspace = true
